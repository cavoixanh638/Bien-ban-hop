<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biên bản họp · Xuất dữ liệu</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:36px auto;padding:16px;color:#243045}textarea{width:100%;height:280px;box-sizing:border-box;font:13px/1.4 monospace}input[type=text]{width:100%;padding:9px;box-sizing:border-box}button{padding:12px 16px;margin:8px;border:0;border-radius:6px;color:white;background:#2353a5;cursor:pointer}</style></head><body><h1>Biên bản họp · Export PoC</h1><p>Xuất dữ liệu trực tiếp trên máy, không gửi JSON lên máy chủ. Dán ProseMirror JSON hoặc NoteDocument.</p><label>Tên cuộc họp<input id="title" type="text" value="HỌP ĐIỀU HÀNH – Hải Phòng"></label><p><label><input id="marked" type="checkbox"> Kèm mốc âm thanh</label></p><label>NoteDocument JSON<textarea id="json"></textarea></label><div id="buttons"><button data-ext="docx">Tải DOCX</button><button data-ext="txt">Tải TXT</button><button data-ext="md">Tải Markdown</button><button data-ext="csv">Tải CSV</button></div><p role="status" id="status">Sẵn sàng.</p><script type="module">import {exportAll,mime} from './exporter.mjs';document.querySelector('#json').value=JSON.stringify(await(await fetch('./fixture.json')).json(),null,2);document.querySelector('#buttons').addEventListener('click',e=>{const ext=e.target.dataset.ext;if(!ext)return;try{const files=exportAll({document:JSON.parse(document.querySelector('#json').value),title:document.querySelector('#title').value,includeTimestamps:document.querySelector('#marked').checked});const blob=new Blob([files[ext]],{type:mime[ext]});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='moc-hop-'+(document.querySelector('#marked').checked?'kem-moc':'ban-sach')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);document.querySelector('#status').textContent='Đã tạo '+ext.toUpperCase()+' ('+blob.size+' byte).';}catch(err){document.querySelector('#status').textContent='Lỗi: '+err.message;}});</script></body></html>
