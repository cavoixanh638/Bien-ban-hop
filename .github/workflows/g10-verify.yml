name: G10 integration verification (no deployment)
on:
  push:
    branches:
      - integration/20261115-g10-v1.2
  pull_request:
    paths:
      - "app/**"
      - "poc/**"
      - ".github/workflows/g10-verify.yml"
permissions:
  contents: read
jobs:
  contracts:
    name: G10 contract + Vite build (Linux/Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test G10 adapters without npm dependencies
        run: node --test app/tests/core.test.mjs
      - name: Install exact-version Tiptap/Vite dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build integrated application
        working-directory: app
        run: npm run build
      - name: Test G01 editor policy (native Node)
        working-directory: poc/01-editor
        run: npm run test:unit
      - name: Test G02 audio and transport (native Node)
        working-directory: poc/02-capture
        run: npm test
      - name: Test G03 OPFS reference (native Node)
        working-directory: poc/03-opfs
        run: npm test
      - name: Test G05 player reference (native Node)
        working-directory: poc/05-player
        run: npm test
      - name: Test G07 backup reference (native Node)
        working-directory: poc/07-backup
        run: npm test
      - name: Test G08 document export (native Node)
        working-directory: poc/08-export
        run: npm test
