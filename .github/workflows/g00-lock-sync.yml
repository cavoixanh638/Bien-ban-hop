name: G00 one-time lockfile sync (no deployment)
on:
  push:
    branches:
      - integration/20261115-g10-v1.2
    paths:
      - app/package.json
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lock only from exact version in package.json
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Push lockfile update (no code or build artifacts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(g00): synchronize exact RNNoise package lock"
            git push origin HEAD:integration/20261115-g10-v1.2
          fi
