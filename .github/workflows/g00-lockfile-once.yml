name: G00 one-time package-lock sync (temporary)
on:
  push:
    branches: [integration/20261115-g10-v1.2]
    paths:
      - .github/workflows/g00-lockfile-once.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact npm lock from current app package
        working-directory: app
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=commonjs -e 'const p=require("./package-lock.json");if(p.name!=="bien-ban-hop"||p.packages[""].name!=="bien-ban-hop")process.exit(1);'
      - name: Commit generated lockfile to the same G00 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/package-lock.json
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git commit -m "chore(g00): track bien-ban-hop npm lockfile"
          git push origin HEAD:refs/heads/integration/20261115-g10-v1.2
